name: Todo App CI/CD

on:
  push:
    branches:
      - dev

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Create Python Virtual Environment
        run: python3 -m venv .venv

      - name: Install Backend Dependencies
        run: .venv/bin/python -m pip install -r backend/requirements.txt

      - name: Validate FastAPI Backend
        run: .venv/bin/python -c "from backend.main import app; print(app.title)"

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy Todo App
        run: |
          mkdir -p /home/ramakrishna/todo-app-deployment/backend
          mkdir -p /home/ramakrishna/todo-app-deployment/frontend
          mkdir -p /home/ramakrishna/todo-app-deployment/.venv
          cp -r backend/. /home/ramakrishna/todo-app-deployment/backend/
          cp -r frontend/dist/. /home/ramakrishna/todo-app-deployment/frontend/
          cp -r .venv/. /home/ramakrishna/todo-app-deployment/.venv/
          echo "Todo App deployed successfully"