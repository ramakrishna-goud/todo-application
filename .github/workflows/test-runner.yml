name: Todo App CI/CD

on:
  push:
    branches:
      - dev
      - feature/kubernetes-cicd

permissions:
  contents: read
  packages: write

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Create Python Virtual Environment
        run: python3 -m venv .venv

      - name: Install Backend Dependencies
        run: .venv/bin/python -m pip install -r backend/requirements.txt

      - name: Validate FastAPI Backend
        run: .venv/bin/python -c "from backend.main import app; print(app.title)"

      - name: Check Node and npm
        run: |
          node --version
          npm --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy Todo App
        run: |
          mkdir -p /home/ramakrishna/todo-app-deployment/backend
          mkdir -p /home/ramakrishna/todo-app-deployment/frontend
          mkdir -p /home/ramakrishna/todo-app-deployment/.venv
          cp -r backend/. /home/ramakrishna/todo-app-deployment/backend/
          cp -r frontend/dist/. /home/ramakrishna/todo-app-deployment/frontend/
          cp -r .venv/. /home/ramakrishna/todo-app-deployment/.venv/
          echo "Todo App deployed successfully"

  build-and-push-images:
    needs: test-and-deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/ramakrishna-goud/todo-backend:v1
            ghcr.io/ramakrishna-goud/todo-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/ramakrishna-goud/todo-frontend:v1
            ghcr.io/ramakrishna-goud/todo-frontend:latest
  deploy-to-minikube:
    needs: build-and-push-images
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Minikube Cluster
        run: |
          minikube status
          kubectl get nodes

      - name: Validate Kubernetes Manifests
        run: kubectl apply --dry-run=server -f k8s/

      - name: Build Backend Image in Minikube
        run: minikube image build -t todo-backend:v1 ./backend

      - name: Build Frontend Image in Minikube
        run: minikube image build -t todo-frontend:v1 ./frontend

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Restart Kubernetes Deployments
        run: |
          kubectl rollout restart deployment/todo-backend
          kubectl rollout restart deployment/todo-frontend

      - name: Wait for Kubernetes Rollouts
        run: |
          kubectl rollout status deployment/todo-backend --timeout=180s
          kubectl rollout status deployment/todo-frontend --timeout=180s

      - name: Display Kubernetes Resources
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services todo-backend todo-frontend

      - name: Test Application Inside Kubernetes
        run: |
          kubectl run "cicd-test-${{ github.run_id }}" \
            --image=busybox:1.36 \
            --restart=Never \
            --rm -i \
            -- wget -qO- http://todo-frontend/api/todos
